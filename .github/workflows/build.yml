name: Build Invoice Printer EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single EXE
        run: pyinstaller InvoicePrinter.spec --noconfirm

      - name: Check output
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: InvoicePrinter
          path: dist/InvoicePrinter.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InvoicePrinter.exe
